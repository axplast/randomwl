name: Hourly file update

on:
  schedule:
    # Каждый час (минута 0)
    - cron: '0 * * * *'
  # Для ручного запуска (опционально)
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4

      - name: Download source file from another GitHub repo
        run: |
          curl -H "Accept: application/vnd.github.v3.raw" \
               -L "https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt" \
               -o original.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run processing script
        run: python process.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vless.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated update $(date -u +'%Y-%m-%d %H:%M:%S')"
          git push
